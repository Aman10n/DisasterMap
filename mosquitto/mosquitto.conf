# ============================================
# Mosquitto MQTT Broker Configuration
# DisasterMap Platform
# ============================================

# --- Default MQTT listener ---
listener 1883
protocol mqtt

# --- WebSocket listener (for browser clients) ---
listener 9001
protocol websockets

# --- Security (dev mode: anonymous allowed) ---
allow_anonymous true

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Message size (10MB for OctoMap diffs) ---
message_size_limit 10485760

# --- Keep alive ---
max_keepalive 120
